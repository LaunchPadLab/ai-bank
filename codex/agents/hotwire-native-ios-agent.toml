## Path Configuration

Path configuration controls navigation behavior via JSON:
```json
{
  "settings": {
    "screenshots_enabled": true
  },
  "rules": [
    {
      "patterns": [".*"],
      "properties": {
        "context": "default",
        "pull_to_refresh_enabled": true
      }
    },
    {
      "patterns": ["/new$", "/edit$"],
      "properties": {
        "context": "modal",
        "pull_to_refresh_enabled": false
      }
    },
    {
      "patterns": ["/numbers$"],
      "properties": {
        "view_controller": "numbers"
      }
    }
  ]
}
```

**Context values:** `default` (push), `modal`
**Presentation values:** `default`, `push`, `pop`, `replace`, `replace_root`, `clear_all`, `refresh`, `none`

## Navigation

### Manual Navigation
```swift
let navigator = Navigator()

// Visit new page
navigator.route(rootURL.appending(path: "foo"))

// Pop
navigator.pop()

// Clear entire stack
navigator.clearAll()
```

### Tab Bar Integration (HotwireTabBarController)
```swift
class MainTabBarController: HotwireTabBarController {
    override func viewDidLoad() {
        super.viewDidLoad()
        
        let homeNavigator = Navigator(configuration: .init(
            name: "home",
            startLocation: URL(string: "https://app.com/home")!
        ))
        
        let profileNavigator = Navigator(configuration: .init(
            name: "profile", 
            startLocation: URL(string: "https://app.com/profile")!
        ))
        
        homeNavigator.rootViewController.tabBarItem = UITabBarItem(
            title: "Home",
            image: UIImage(systemName: "house"),
            selectedImage: nil
        )
        
        viewControllers = [
            homeNavigator.rootViewController,
            profileNavigator.rootViewController
        ]
    }
}
```

## Bridge Components (JS ↔ Swift)

Bridge components enable native UI integration with web content.

### Three-Part Structure

**1. HTML (Server):**
```html
<a href="/profile" data-controller="button" data-bridge-title="Profile">
  View profile
</a>
```

**2. JavaScript Controller:**
```javascript
import { BridgeComponent } from "hotwired/hotwire-native-bridge"

export default class extends BridgeComponent {
  static component = "button"

  connect() {
    super.connect()
    const element = this.bridgeElement
    const title = element.bridgeAttribute("title")
    
    this.send("connect", {title}, () => {
      this.element.click()
    })
  }
}
```

**3. Swift Component:**
```swift
import HotwireNative
import UIKit

final class ButtonComponent: BridgeComponent {
    override class var name: String { "button" }

    override func onReceive(message: Message) {
        guard let viewController = delegate?.destination as? UIViewController,
              let data: MessageData = message.data() else { return }

        let action = UIAction { [unowned self] _ in
            self.reply(to: "connect")
        }
        let item = UIBarButtonItem(title: data.title, primaryAction: action)
        viewController.navigationItem.rightBarButtonItem = item
    }
}

private extension ButtonComponent {
    struct MessageData: Decodable {
        let title: String
    }
}
```

### Form Component Example
```swift
final class FormComponent: BridgeComponent {
    override class var name: String { "form" }

    override func onReceive(message: Message) {
        guard let event = Event(rawValue: message.event) else { return }

        switch event {
        case .connect: handleConnectEvent(message: message)
        case .submitEnabled: submitBarButtonItem?.isEnabled = true
        case .submitDisabled: submitBarButtonItem?.isEnabled = false
        }
    }

    private weak var submitBarButtonItem: UIBarButtonItem?
    
    private var viewController: UIViewController? {
        delegate?.destination as? UIViewController
    }

    private func handleConnectEvent(message: Message) {
        guard let data: MessageData = message.data() else { return }
        // Configure submit button in nav bar
    }
}

private extension FormComponent {
    enum Event: String {
        case connect, submitEnabled, submitDisabled
    }
    
    struct MessageData: Decodable {
        let title: String
    }
}
```

## Authentication

### Cookie-Based (Simple)
WKWebView automatically handles persistent cookies. Ensure server sets persistent cookies, not session cookies.

### Token-Based with Cookie Sync
```swift
// 1. Store token in Keychain
let keychain = Keychain(service: "App-Credentials")
keychain["access-token"] = token.token

// 2. Sync cookies to WKWebView
let cookies = HTTPCookie.cookies(withResponseHeaderFields: headers, for: url)
HTTPCookieStorage.shared.setCookies(cookies, for: url, mainDocumentURL: nil)

let cookieStore = WKWebsiteDataStore.default().httpCookieStore
for cookie in cookies {
    await cookieStore.setCookie(cookie)
}
```

### Handle 401 Unauthorized
```swift
extension SceneDelegate: NavigatorDelegate {
    func visitableDidFailRequest(_ visitable: Visitable, error: Error, retryHandler: escaping () -> Void) {
        if let turboError = error as? TurboError {
            switch turboError {
            case .http(let statusCode) where statusCode == 401:
                presentLoginScreen(retryHandler: retryHandler)
            default:
                presentError(error, retryHandler: retryHandler)
            }
        }
    }
}
```

## Native Screens

### PathConfigurationIdentifiable Protocol
```swift
class NumbersViewController: UITableViewController, PathConfigurationIdentifiable {
    static var pathConfigurationIdentifier: String { "numbers" }
    
    private let url: URL
    
    init(url: URL) {
        self.url = url
        super.init(style: .plain)
    }
    
    required init?(coder: NSCoder) {
        fatalError("init(coder:) not implemented")
    }
}
```

### NavigatorDelegate for Native Routing
```swift
extension SceneDelegate: NavigatorDelegate {
    func handle(proposal: VisitProposal, from navigator: Navigator) -> ProposalResult {
        switch proposal.viewController {
        case NumbersViewController.pathConfigurationIdentifier:
            let numbersVC = NumbersViewController(url: proposal.url)
            return .acceptCustom(numbersVC)
        default:
            return .accept
        }
    }
}
```

## Error Handling

### Custom Error View (v1.3+)
```swift
import SwiftUI

Hotwire.config.makeCustomErrorView = { error, handler in
    AnyView(MyErrorView(error: error, onRetry: handler))
}

struct MyErrorView: View {
    let error: Error
    let onRetry: ErrorPresenter.Handler?

    var body: some View {
        VStack(spacing: 12) {
            Text("Uh oh…").font(.title.bold())
            Text(error.localizedDescription).multilineTextAlignment(.center)
            if let onRetry {
                Button("Try again", action: onRetry)
            }
        }
        .padding()
    }
}
```

## Configuration Reference

| Configuration | Description |
|--------------|-------------|
| `Hotwire.config.debugLoggingEnabled` | Enable debug logging |
| `Hotwire.config.applicationUserAgentPrefix` | Custom user agent prefix |
| `Hotwire.config.showDoneButtonOnModals` | Add Done button to modals |
| `Hotwire.config.backButtonDisplayMode` | Back button display mode |
| `Hotwire.config.defaultViewController` | Custom default view controller |
| `Hotwire.config.makeCustomWebView` | Custom WKWebView factory |
| `Hotwire.config.makeCustomErrorView` | Custom error view |
| `Hotwire.config.pathConfiguration.matchQueryStrings` | Match query strings in rules |

## Rails Server-Side Integration

### turbo-rails Helpers
```ruby
class ApplicationController < ActionController::Base
  include Turbo::Native::Navigation
  
  private
  
  def set_request_variant
    request.variant = :phone if turbo_native_app?
  end
end
```

### Native Navigation Redirects
```ruby
# In controllers after form submission
recede_or_redirect_to posts_path    # Dismisses modal on native
resume_or_redirect_to posts_path    # Ignores on native, redirects on web
refresh_or_redirect_to posts_path   # Refreshes current screen on native
```

### Conditional Rendering
```erb
<% unless turbo_native_app? %>
  <nav>Web-only navigation</nav>
<% end %>
```

## Best Practices

1. **Start with web screens** from existing Rails app
2. **Add path configuration** for navigation behavior
3. **Implement bridge components** for native UI elements
4. **Convert high-impact screens** to fully native when needed
5. **Bundle local path config** for offline support
6. **Version remote path configs** (/ios_v1.json, /ios_v2.json)
7. **Use screenshots_enabled** for smooth transitions
8. **Handle 401** for authentication flows
9. **Add usage descriptions** for camera, photo library, etc.

