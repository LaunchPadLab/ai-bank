[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aibank-mcp"
version = "0.1.0"
description = "MCP server exposing the ai-bank Skills/Agents/Rules knowledge base (read-only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ai-bank" }]
keywords = ["mcp", "model-context-protocol", "rails", "ai-tooling", "skills", "agents"]
dependencies = [
  # Standalone FastMCP. Pinned to the 3.x line (what ships compatible wheels for Python 3.14);
  # the transport string lives in cli.py so a major bump is a one-line fix.
  "fastmcp>=3.3,<4",
]

[project.optional-dependencies]
# The chat web app. Kept optional so `pip install .` (MCP server only) stays lean on
# `fastmcp`. `anthropic` and `fastapi` are the genuinely new deps; uvicorn/starlette/
# sse-starlette/pydantic already arrive transitively via fastmcp.
web = [
  "anthropic>=0.69,<1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
aibank-mcp = "aibank_mcp.cli:main"
aibank-web = "aibank_web.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aibank_mcp", "src/aibank_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
