# Build-from-source override (maintainers, inside a repo checkout).
# Adds a build section to the aibank-mcp service so the image is built locally and tagged as the
# name in docker-compose.yml, instead of being pulled from GHCR. Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Standalone hosts that pull the published image do NOT need this file.

services:
  aibank-mcp:
    build:
      context: ..
      dockerfile: server/Dockerfile
